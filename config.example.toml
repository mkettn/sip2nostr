[sip]
provider_host = "sip.your-provider.de"
username = "YOUR_SIP_USER"
password = "YOUR_SIP_PASS"
# Optional: set this to the public host/IP your SIP provider should use
# for inbound calls if REGISTER succeeds but no INVITE reaches this process.
# contact_host = "203.0.113.10"
# Local RTP port for SIP audio. Twinkle commonly uses 8000.
rtp_port = 8000

[dns]
# Address of the resolver to use for SIP hostname lookups.
# Falls back to system resolver if omitted.
resolver = "1.1.1.1:53"
resolver_fallback = "9.9.9.9:53"
timeout_ms = 2000

[logging]
# Optional: write each process run to its own log file.
# Relative paths are resolved next to this config file. If the path does
# not include {timestamp} or {run}, a timestamp is added before the extension.
run_file = "logs/sip2nostr-{timestamp}.log"

[[lines]]
uri = "sip:+4989123456@sip.your-provider.de"
label = "main"
# Optional: when [nostr].enabled is false, answer calls on this line and
# play this file on loop to test SIP audio. Raw 8 kHz 16-bit PCM works
# directly; mono Ogg/Opus (.ogg/.opus) is decoded in-process.
# sound = "sounds/test.opus"

[[lines]]
uri = "sip:+4989123457@sip.your-provider.de"
label = "fax"

[nostr]
enabled = true
relays = ["wss://relay.example.com", "wss://relay2.example.com"]
bridge_nsec = "nsec1..."      # this daemon's own identity, added as a contact in the receiving client
target_npub = "npub1..."      # your identity - every call latches here in the MVP (see README)

[webrtc]
stun_servers = ["stun:stun.l.google.com:19302"]
turn_server = ""               # optional, recommended for NAT traversal

[callerlist]
# A blacklist match always rejects the call, regardless of whitelist.
# An empty whitelist means blacklist-only mode: everyone not blacklisted
# is allowed through. A non-empty whitelist switches to deny-by-default:
# only whitelisted numbers get through (still overridable by a blacklist
# match). Numbers are normalized before comparison (spaces/dashes
# stripped, "00" international prefix folded to "+"), so either format
# works here.
blacklist = []
whitelist = []

[voicemail]
# Answering-machine fallback for when [nostr] is enabled but target_npub
# never answers the call. Opt-in - disabled unless set to true. See
# docs/voicemail.md.
enabled = false
# How long to wait for a WebRTC answer over Nostr before falling back.
ring_timeout_seconds = 20
# Caller is disconnected after this long even if they keep talking.
# The default is the largest value that reliably still fits in a single
# NIP-17 DM at the current Opus encoding - ConfigLoader rejects anything
# larger at startup. This ceiling only applies to delivery = "audio"
# below; delivery = "text" is instead capped by
# max_text_recording_seconds, since a transcript isn't bound by the same
# DM size budget. See docs/voicemail.md.
max_recording_seconds = 27
# The max_recording_seconds ceiling used when delivery = "text" below.
# Not derived from anything - just a sanity limit on how much PCM is
# buffered in memory while recording, so raise it only as far as this
# host's available RAM comfortably allows for the busiest realistic case
# (one recording per line, worst case all lines at once). ConfigLoader
# rejects anything above 3600 (1 hour) at startup, so this can't itself
# become unbounded.
max_text_recording_seconds = 600
# Passed to Concentus' Ogg writer when encoding a recording. Only takes
# effect if the writer's input and output sample rates ever differ -
# they don't today (both are the recording's own rate), so this
# currently has no observable effect; kept configurable for when that
# changes. 0 (fastest) - 10 (best); ConfigLoader rejects anything
# outside that range at startup.
opus_resampler_quality = 5
# Optional. Same format rules as [[lines]].sound: raw 8 kHz 16-bit PCM
# works directly, mono Ogg/Opus (.ogg/.opus) is decoded in-process. Falls
# back to a short tone if unset.
# greeting_sound = "sounds/greeting.opus"
# Where recordings are saved (as Ogg/Opus), relative to this config file
# unless rooted. Always written, regardless of whether the Nostr send succeeds.
recordings_dir = "voicemail"
# Filename for a saved recording, relative to recordings_dir above.
# Placeholders: {timestamp} (yyyyMMdd-HHmmss), {caller} (the normalized
# caller number), {call_id} (a per-call unique id, not a phone number -
# useful if you'd rather not have the caller's number in filenames).
# Must include {timestamp} or {call_id} so recordings from different
# calls can't overwrite each other, must be a relative path (joined onto
# recordings_dir above - a rooted value would silently discard it), and
# must not contain a ".." segment - ConfigLoader rejects a value
# violating any of these at startup. A path separator is fine otherwise,
# e.g. "{caller}/{timestamp}.ogg" to group recordings per caller.
recording_filename = "{timestamp}-{caller}.ogg"
# Optional. Relays to publish the voicemail DM to, if different from
# [nostr].relays above - e.g. target_npub advertises a separate NIP-17
# DM inbox relay list (kind:10050). Falls back to the Nostr SDK's default
# NIP-17 relay resolution against [nostr].relays if left empty.
# dm_relays = ["wss://dm-relay.example.com"]
# "audio" inlines Opus/OGG (default, subject to the NIP-17 size budget
# above); "text" transcribes the recording and sends the transcript
# instead - see [voicemail.transcription] below and docs/voicemail.md.
delivery = "audio"

# Only consulted when [voicemail].delivery = "text".
[voicemail.transcription]
# The only engine available today.
engine = "whisper"
# Required for delivery = "text". Path to a GGML model file, e.g. one
# downloaded via whisper.cpp's models/download-ggml-model.sh script.
# Relative to this config file unless rooted.
# model_path = "models/ggml-base.en.bin"
# Optional. An ISO 639-1 code (e.g. "en"). Unset auto-detects the spoken
# language per recording, at some accuracy/latency cost.
# language = "en"
