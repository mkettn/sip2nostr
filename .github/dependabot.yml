version: 2
updates:
  # open-pull-requests-limit: 0 disables version updates; security updates
  # are not subject to this limit and still open PRs.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
