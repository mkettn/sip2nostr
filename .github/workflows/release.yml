name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # Framework-dependent (needs the .NET 8 runtime installed on the
      # target - not bundled) but single-file: every managed dependency is
      # packed into the one executable, and IncludeNativeLibrariesForSelfExtract
      # does the same for Whisper.net.Runtime's native library, so there's
      # nothing left to ship alongside it as a separate file.
      - name: Publish
        run: |
          dotnet publish src/Sip2Nostr/Sip2Nostr.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.rid }}

      # Whisper.net.Runtime ships every platform's native binaries
      # regardless of target RID, and dotnet publish -r doesn't prune
      # them - out/${{ matrix.rid }} still has win-x64/macos-arm64/...
      # native libraries and a macOS-only Metal shader resource sitting
      # in it as loose files afterward (never eligible for embedding into
      # a Linux single-file binary in the first place - IncludeNativeLibrariesForSelfExtract
      # only filters by "loadable on this OS" at bundle time, not by CPU
      # architecture). Sip2Nostr.csproj's ExcludeMismatchedLinuxWhisperNatives
      # target handles the other Linux architectures the same flag WOULD
      # otherwise embed (linux-x64/linux-arm64/linux-arm are all
      # "loadable on this OS"). None of this needs cleaning up here: the
      # next step only moves the one binary out of out/${{ matrix.rid }},
      # and only that file gets uploaded - whatever's left in that
      # directory is simply discarded with the rest of the runner.
      - name: Rename binary for release
        run: |
          mv out/${{ matrix.rid }}/Sip2Nostr sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          chmod +x sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sip2nostr-${{ matrix.rid }}
          path: sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/*
          draft: false
          prerelease: ${{ needs.version.outputs.is_tag != 'true' }}
          generate_release_notes: true
