name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # Framework-dependent (needs the .NET 8 runtime installed on the
      # target - not bundled) but single-file: every managed dependency is
      # packed into the one executable, and IncludeNativeLibrariesForSelfExtract
      # does the same for Whisper.net.Runtime's native library, so there's
      # nothing left to ship alongside it as a separate file.
      - name: Publish
        run: |
          dotnet publish src/Sip2Nostr/Sip2Nostr.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.rid }}

      # Whisper.net.Runtime ships every platform's native binaries
      # regardless of target RID (docs/voicemail.md's "Known limitations"),
      # and dotnet publish -r doesn't prune them - IncludeNativeLibrariesForSelfExtract
      # above only embeds the one this RID actually needs into the single
      # file; the rest of runtimes/ (win-x64, macos-arm64, ...) plus a
      # macOS-only Metal shader resource are left behind as loose, useless
      # files that would otherwise still ship in the tarball.
      - name: Remove other platforms' bundled native libraries
        run: |
          rm -rf out/${{ matrix.rid }}/runtimes
          find out/${{ matrix.rid }} -name '*.metal' -delete

      - name: Package tarball
        run: |
          cp config.example.toml README.md out/${{ matrix.rid }}/
          tar -czf sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz \
            -C out/${{ matrix.rid }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sip2nostr-${{ matrix.rid }}
          path: sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/*.tar.gz
          draft: false
          prerelease: ${{ needs.version.outputs.is_tag != 'true' }}
          generate_release_notes: true
