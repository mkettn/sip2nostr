name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
        mode: [selfcontained, framework]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained)
        if: matrix.mode == 'selfcontained'
        run: |
          dotnet publish src/Sip2Nostr/Sip2Nostr.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.rid }}-${{ matrix.mode }}

      - name: Publish (framework-dependent)
        if: matrix.mode == 'framework'
        run: |
          dotnet publish src/Sip2Nostr/Sip2Nostr.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -o out/${{ matrix.rid }}-${{ matrix.mode }}

      - name: Package tarball
        run: |
          cp config.example.toml README.md out/${{ matrix.rid }}-${{ matrix.mode }}/
          tar -czf sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}-${{ matrix.mode }}.tar.gz \
            -C out/${{ matrix.rid }}-${{ matrix.mode }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sip2nostr-${{ matrix.rid }}-${{ matrix.mode }}
          path: sip2nostr-${{ needs.version.outputs.version }}-${{ matrix.rid }}-${{ matrix.mode }}.tar.gz

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/*.tar.gz
          draft: false
          prerelease: ${{ needs.version.outputs.is_tag != 'true' }}
          generate_release_notes: true
