# Creates the system user/group sip2nostr runs as (see User=/Group= in
# ../sip2nostr.service). Its home, /var/local/lib/sip2nostr, is where
# config.toml (SIP password, bridge_nsec) and any locally-configured
# sound/model files live - owned and readable only by this user.
#
# The directory itself is created by install.sh, not by sysusers.d -
# this file only creates the user and group.
#
# Applied automatically by ../../install.sh. Manual install: copy to
# /usr/local/lib/sysusers.d/ (sysusers.d(5)'s location for locally
# installed, non-distro-packaged software - not /usr/lib/sysusers.d,
# which is for the latter) and apply with `systemd-sysusers`.
#
#Type  Name        ID  GECOS                Home directory             Shell
u      sip2nostr   -   "sip2nostr service"   /var/local/lib/sip2nostr   /usr/sbin/nologin
